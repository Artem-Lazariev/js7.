<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="s.css">
</head>
<body>
<ul id="categories">
    <li class="item">
        <h2>Тварини</h2>
        <ul>
            <li>Кіт</li>
            <li>Хом'як</li>
            <li>Кінь</li>
            <li>Папуга</li>
        </ul>
    </li>
    <li class="item">
        <h2>Продукти</h2>

        <ul>
            <li>Хліб</li>
            <li>Петрушка</li>
            <li>Сир</li>
        </ul>
    </li>
    <li class="item">
        <h2>Технології</h2>

        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
            <li>React</li>
            <li>Node</li>
        </ul>
    </li>
</ul>
<ul id="ingredients"></ul>
<ul id="gallery"></ul>
<div id="counter">
    <button type="button" data-action="decrement" id="-1">-1</button>
    <span id="value">0</span>
    <button type="button" data-action="increment" id="+1">+1</button>
</div>
<input type="text" placeholder="Ваше ім'я?" id="name-input" value="a" />
<h1>Привіт, <span id="name-output">незнайомець</span>!</h1>
<input type="text" id="validation-input" data-length="6" placeholder="Введи 6 символів"/>
<input id="font-size-control" type="range" />
<br />
<span id="text">Абракадабра!</span>
<script src="index.js"></script>

</body>
</html>
